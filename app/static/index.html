<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ميدان ١٣ | واتساب</title>
<style>
  :root {
    --header: #008069;
    --header-text: #ffffff;
    --chat-bg: #efeae2;
    --bubble-bot: #ffffff;
    --bubble-user: #d9fdd3;
    --text: #111b21;
    --muted: #667781;
    --bar-bg: #f0f2f5;
    --input-bg: #ffffff;
    --chip-bg: #ffffff;
    --chip-border: #d1d7db;
    --send: #00a884;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", Tahoma, "Noto Sans Arabic", Arial, sans-serif;
    background: var(--chat-bg);
    color: var(--text);
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 720px;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--chat-bg);
    box-shadow: 0 0 12px rgba(0,0,0,.08);
  }
  header {
    background: var(--header);
    color: var(--header-text);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    padding-top: max(10px, env(safe-area-inset-top));
  }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: #ffffff; color: var(--header);
    display: grid; place-items: center;
    font-weight: 700; font-size: 16px; flex: none;
  }
  .title { font-size: 17px; font-weight: 600; line-height: 1.2; }
  .subtitle { font-size: 13px; opacity: .85; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .row { display: flex; flex-direction: column; max-width: 80%; }
  .row.bot { align-self: flex-start; }   /* right side in RTL */
  .row.user { align-self: flex-end; }    /* left side in RTL */
  .bubble {
    padding: 7px 10px 8px;
    border-radius: 8px;
    font-size: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    box-shadow: 0 1px .5px rgba(11,20,26,.13);
  }
  .bot .bubble { background: var(--bubble-bot); border-top-right-radius: 0; }
  .user .bubble { background: var(--bubble-user); border-top-left-radius: 0; }
  .note { font-size: 12px; color: var(--muted); margin-top: 3px; padding: 0 4px; }
  .debug {
    display: none;
    direction: ltr; text-align: left;
    font-family: Consolas, "Courier New", monospace;
    font-size: 11px; color: var(--muted);
    margin-top: 3px; padding: 0 4px;
    overflow-wrap: anywhere;
  }
  body.show-debug .debug { display: block; }
  .debug-toggle {
    margin-inline-start: auto;
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; opacity: .85; cursor: pointer;
    user-select: none;
  }
  .debug-toggle input { accent-color: #25d366; cursor: pointer; }
  .typing .bubble { color: var(--muted); font-style: italic; }
  .error .bubble { background: #fde8e8; }
  .day {
    align-self: center;
    background: #ffffff; color: var(--muted);
    font-size: 12.5px; padding: 5px 12px; border-radius: 8px;
    box-shadow: 0 1px .5px rgba(11,20,26,.13);
    margin-bottom: 6px; text-align: center;
  }
  .bar {
    background: var(--bar-bg);
    padding: 8px 12px;
    padding-bottom: max(8px, env(safe-area-inset-bottom));
  }
  form { display: flex; gap: 8px; align-items: center; }
  #input {
    flex: 1; min-width: 0;
    border: none; border-radius: 22px;
    padding: 11px 16px;
    font: inherit; font-size: 15px;
    background: var(--input-bg); color: var(--text);
    outline: none;
  }
  #send {
    width: 44px; height: 44px; flex: none;
    border: none; border-radius: 50%;
    background: var(--send); color: #ffffff;
    font-size: 18px; cursor: pointer;
    display: grid; place-items: center;
  }
  #send:disabled { opacity: .5; cursor: default; }
  #send svg { transform: scaleX(-1); } /* arrow points left in RTL */
  .examples {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-top: 8px;
  }
  .examples button {
    border: 1px solid var(--chip-border);
    background: var(--chip-bg); color: var(--text);
    border-radius: 16px;
    padding: 6px 12px;
    font: inherit; font-size: 13px;
    cursor: pointer;
  }
  .examples button:disabled { opacity: .5; cursor: default; }
  @media (prefers-color-scheme: dark) {
    :root {
      --header: #202c33;
      --header-text: #e9edef;
      --chat-bg: #0b141a;
      --bubble-bot: #202c33;
      --bubble-user: #005c4b;
      --text: #e9edef;
      --muted: #8696a0;
      --bar-bg: #202c33;
      --input-bg: #2a3942;
      --chip-bg: #2a3942;
      --chip-border: #3b4a54;
    }
    .avatar { background: #00a884; color: #ffffff; }
    .day { background: #182229; }
    .error .bubble { background: #5c2b2b; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">١٣</div>
    <div>
      <div class="title">ميدان ١٣</div>
      <div class="subtitle">خدمة العملاء · بيرد عليك بوت</div>
    </div>
    <label class="debug-toggle" title="Show model, latency and reason under each reply">
      <input type="checkbox" id="debugToggle"> debug
    </label>
  </header>

  <main id="messages" aria-live="polite">
    <div class="day">محل وهمي للتجربة. اسأل عن الأسعار، المقاسات، الشحن أو الاسترجاع.</div>
    <div class="row bot"><div class="bubble">أهلًا بيك في ميدان ١٣ 👋 تحب تسأل عن إيه؟</div></div>
  </main>

  <div class="bar">
    <form id="form" autocomplete="off">
      <input id="input" type="text" maxlength="1000" placeholder="اكتب رسالة" aria-label="اكتب رسالة">
      <button id="send" type="submit" aria-label="إرسال">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M3.4 20.4 21 12 3.4 3.6 3.4 10.2 15 12 3.4 13.8z"/>
        </svg>
      </button>
    </form>
    <div class="examples" id="examples">
      <button type="button">الهودي بكام؟</button>
      <button type="button">طولي 178 ووزني 80 ألبس مقاس إيه في الهودي؟</button>
      <button type="button">الشحن لإسكندرية بكام وبياخد قد إيه؟</button>
      <button type="button">عايز آخد 50 قطعة جملة، سعر الجملة كام؟</button>
    </div>
  </div>
</div>

<script>
  const HISTORY_LIMIT = 6;
  const messages = document.getElementById("messages");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const exampleBtns = document.querySelectorAll("#examples button");
  const history = []; // [{role: "user"|"bot", text}]
  let busy = false;

  function addBubble(role, text, extraClass, note) {
    const row = document.createElement("div");
    row.className = "row " + role + (extraClass ? " " + extraClass : "");
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    row.appendChild(bubble);
    if (note) {
      const n = document.createElement("div");
      n.className = "note";
      n.textContent = note;
      row.appendChild(n);
    }
    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
    return row;
  }

  function addDebug(row, data) {
    const d = data.debug || {};
    const line = document.createElement("div");
    line.className = "debug";
    line.textContent =
      "model: " + (d.model_used || "none") + (d.fallback_used ? " (fallback)" : "") +
      " · " + (d.latency_ms ?? "?") + " ms" +
      " · handoff: " + data.handoff +
      " · reason: " + (data.reason || "-");
    row.appendChild(line);
  }

  // Debug toggle: off by default, remembered in this browser only.
  const debugToggle = document.getElementById("debugToggle");
  function applyDebug(on) {
    document.body.classList.toggle("show-debug", on);
    debugToggle.checked = on;
  }
  try { applyDebug(localStorage.getItem("debug") === "1"); } catch (e) { applyDebug(false); }
  debugToggle.addEventListener("change", () => {
    applyDebug(debugToggle.checked);
    try { localStorage.setItem("debug", debugToggle.checked ? "1" : "0"); } catch (e) {}
  });

  function setBusy(value) {
    busy = value;
    sendBtn.disabled = value;
    exampleBtns.forEach(b => b.disabled = value);
  }

  async function send(text) {
    text = text.trim();
    if (!text || busy) return;
    const previous = history.slice(-HISTORY_LIMIT);
    addBubble("user", text);
    history.push({ role: "user", text });
    input.value = "";
    setBusy(true);
    const typing = addBubble("bot", "بيكتب…", "typing");
    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, history: previous }),
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      typing.remove();
      const row = addBubble("bot", data.reply, "", data.handoff ? "تم تحويل المحادثة لموظف" : "");
      addDebug(row, data);
      history.push({ role: "bot", text: data.reply });
    } catch (err) {
      typing.remove();
      addBubble("bot", "حصلت مشكلة في الاتصال، جرّب تبعت تاني.", "error");
    } finally {
      setBusy(false);
      input.focus();
    }
  }

  form.addEventListener("submit", e => { e.preventDefault(); send(input.value); });
  exampleBtns.forEach(b => b.addEventListener("click", () => send(b.textContent)));
</script>
</body>
</html>
